name: Algorithm evaluation checks
on:
  pull_request:
  push:
    branches: [main, 'feature/algorithm-evaluation']
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            backend/requirements.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m compileall -q backend tools/evaluate_algorithms.py tools/run_carla_evaluation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/evaluation.js
      - run: docker compose -f infra/compose.yml --profile evaluation config --quiet
